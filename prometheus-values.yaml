server:
  persistentVolume:
    enabled: false

  retention: 24h

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  global:
    scrape_interval: 15s
    evaluation_interval: 15s

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

extraScrapeConfigs: |
  - job_name: "devops-portfolio-app"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "devops-portfolio:5000"